<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" role="img" aria-labelledby="title desc">
  <title id="title">Topología en malla</title>
  <desc id="desc">Todos los nodos tienen varias rutas de comunicación entre sí.</desc>
  <rect width="320" height="170" rx="18" fill="#ecfeff"/>
  <g stroke="#0891b2" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="84" y1="48" x2="160" y2="28"/>
    <line x1="160" y1="28" x2="236" y2="48"/>
    <line x1="84" y1="48" x2="64" y2="112"/>
    <line x1="236" y1="48" x2="256" y2="112"/>
    <line x1="64" y1="112" x2="160" y2="132"/>
    <line x1="256" y1="112" x2="160" y2="132"/>
    <line x1="84" y1="48" x2="236" y2="48"/>
    <line x1="64" y1="112" x2="256" y2="112"/>
    <line x1="84" y1="48" x2="160" y2="132"/>
    <line x1="236" y1="48" x2="160" y2="132"/>
    <line x1="160" y1="28" x2="64" y2="112"/>
    <line x1="160" y1="28" x2="256" y2="112"/>
  </g>
  <g fill="#06b6d4" stroke="#155e75" stroke-width="4">
    <circle cx="160" cy="28" r="16"/>
    <circle cx="84" cy="48" r="16"/>
    <circle cx="236" cy="48" r="16"/>
    <circle cx="64" cy="112" r="16"/>
    <circle cx="256" cy="112" r="16"/>
    <circle cx="160" cy="132" r="16"/>
  </g>
  <text x="160" y="160" text-anchor="middle" fill="#164e63" font-family="Arial, sans-serif" font-size="18" font-weight="700">MALLA</text>
</svg>
