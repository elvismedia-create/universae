<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" role="img" aria-labelledby="title desc">
  <title id="title">Topología en árbol</title>
  <desc id="desc">Un nodo principal se divide en ramas con nodos secundarios.</desc>
  <rect width="320" height="170" rx="18" fill="#f0fdf4"/>
  <g stroke="#16a34a" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="160" y1="34" x2="160" y2="72"/>
    <line x1="160" y1="72" x2="86" y2="106"/>
    <line x1="160" y1="72" x2="234" y2="106"/>
    <line x1="86" y1="106" x2="56" y2="132"/>
    <line x1="86" y1="106" x2="116" y2="132"/>
    <line x1="234" y1="106" x2="204" y2="132"/>
    <line x1="234" y1="106" x2="264" y2="132"/>
  </g>
  <g fill="#22c55e" stroke="#166534" stroke-width="4">
    <circle cx="160" cy="30" r="17"/>
    <circle cx="86" cy="106" r="15"/>
    <circle cx="234" cy="106" r="15"/>
    <circle cx="56" cy="134" r="13"/>
    <circle cx="116" cy="134" r="13"/>
    <circle cx="204" cy="134" r="13"/>
    <circle cx="264" cy="134" r="13"/>
  </g>
  <text x="160" y="160" text-anchor="middle" fill="#14532d" font-family="Arial, sans-serif" font-size="18" font-weight="700">ARBOL</text>
</svg>
